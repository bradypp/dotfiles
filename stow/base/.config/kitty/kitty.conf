font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
disable_ligatures never

# Nerd Font icons: map symbol ranges to an installed Nerd Font
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A2,U+E0B0-U+E0B3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B5,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A8,U+F500-U+FD46 FantasqueSansM Nerd Font Mono

background_opacity 0.8
# dynamic_background_opacity yes
background_blur 1
# cursor           #c0caf5
# cursor #ff00ff
cursor_trail     3
cursor_trail_decay 0.05 0.2
# cursor_shape beam
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

scrollback_lines 10000
copy_on_select   yes
strip_trailing_spaces smart
enable_audio_bell no
hide_window_decorations no
window_padding_width 8
confirm_os_window_close 0
tab_bar_style    fade
tab_activity_symbol "● "

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+o open_url_with_hints

# Window
# window_padding_width 14
# hide_window_decorations yes
# confirm_os_window_close 0

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME