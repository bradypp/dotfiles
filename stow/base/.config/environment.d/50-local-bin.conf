# Put ~/.local/bin on the login-session PATH so KRunner and GUI-launched
# apps find user scripts (e.g. mnemosyne-dashboard).
# Takes effect when the systemd user manager (re)starts, e.g. at boot —
# linger keeps the manager alive across logouts, so relogin alone is not
# enough. For the running manager: systemctl --user set-environment with
# the same value, then restart the affected GUI processes.
# Revert: delete this file, run `cd ~/repos/dotfiles && ./deploy`,
# restore the running manager with:
#   systemctl --user set-environment PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/var/lib/flatpak/exports/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
# then restart KRunner (kquitapp6 krunner). A reboot covers everything.
PATH=$HOME/.local/bin:${PATH}
